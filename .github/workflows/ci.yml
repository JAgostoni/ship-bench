name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:run -- --coverage
      # Fails the build on a high or critical advisory (architecture.md §13.2 lists
      # dependency vulnerabilities as a threat with this mitigation). Moderate and
      # below are reported but do not gate, and `npm audit --omit=dev` is
      # deliberately not used: the advisories that matter here are in the build
      # toolchain (drizzle-kit's esbuild), which never ships to a runtime.
      - run: npm audit --audit-level=high
      - run: npm run build
        env:
          DATABASE_FILE: ./data/kb.ci.db
      - run: npm run db:migrate
        env:
          DATABASE_FILE: ./data/kb.ci.db
      - run: npx playwright install --with-deps chromium webkit
      # The E2E gate. `playwright.config.ts` starts and tears down its own dev server
      # on the separate `./data/kb.e2e.db`, so nothing here points at `kb.ci.db` and
      # the developer's `kb.db` is never involved (§9.7).
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
